- name: "MEDIUM | unix_214265 | The Apache web server must generate log records that can be mapped to Coordinated Universal Time (UTC) or Greenwich Mean Time (GMT) which are stamped at a minimum granularity of one second"
  block:
    - name: "MEDIUM | unix_214265 | The Apache web server must generate log records that can be mapped to Coordinated Universal Time (UTC) or Greenwich Mean Time (GMT) which are stamped at a minimum granularity of one second | Check if log_config_module exists"
      shell: cat /etc/httpd/conf/httpd.conf | grep -i "<IfModule log_config_module>"
      changed_when: false
      register: apache_214265_log_config_module_exist

    - name: "MEDIUM | unix_214265 | The Apache web server must generate log records that can be mapped to Coordinated Universal Time (UTC) or Greenwich Mean Time (GMT) which are stamped at a minimum granularity of one second | Add log_config_module section"
      blockinfile:
        path: /etc/httpd/conf/httpd.conf
        marker: "# {mark} log_config_module ANSIBLE MANAGED BLOCK"
        block: |
          <IfModule log_config_module>
              #
              # The following directives define some format nicknames for use with
              # a CustomLog directive (see below).
              #
              LogFormat "%h %l %u %t \"%r\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\"" combined
              LogFormat "%h %l %u %t \"%r\" %>s %b" common
              LogFormat "%a %A %h %H %l %m %s %u %t %U \"%{Referer}i\" " common

              <IfModule logio_module>
                # You need to enable mod_logio.c to use %I and %O
                LogFormat "%h %l %u %t \"%r\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\" %I %O" combinedio
              </IfModule>

              #
              # The location and format of the access logfile (Common Logfile Format).
              # If you do not define any access logfiles within a <VirtualHost>
              # container, they will be logged here.  Contrariwise, if you *do*
              # define per-<VirtualHost> access logfiles, transactions will be
              # logged therein and *not* in this file.
              #
              #CustomLog "logs/access_log" common

              #
              # If you prefer a logfile with access, agent, and referer information
              # (Combined Logfile Format) you can use the following directive.
              #
              CustomLog "logs/access_log" combined
          </IfModule>
      when: apache_214265_log_config_module_exist.stdout == ""
  when:
    - unix_214265
  tags:
    - V-214265
    - cat2
    - medium
    - RedHat
    - notimplemented

- name: |
