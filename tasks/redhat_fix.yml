---
# CAT I Tasks
- name: "HIGH | unix_214242 | The Apache web server must provide install options to exclude the installation of documentation, sample code, example applications, and tutorials"
  block:
    - name: "HIGH | unix_214242 | The Apache web server must provide install options to exclude the installation of documentation, sample code, example applications, and tutorials | List items in httpd folder"
      command: ls /etc/httpd
      register: apache_214242_httpd_files
      changed_when: false

    - name: "HIGH | unix_214242 | The Apache web server must provide install options to exclude the installation of documentation, sample code, example applications, and tutorials | Display contents of httpd folder"
      debug:
        msg:
          - "Below is the folder list of items in your httpd folder"
          - "Review the contents with your ISSO for approval"
          - "{{ apache_214242_httpd_files.stdout_lines }}"
  when:
    - unix_214242
  tags:
    - V-214242
    - cat1
    - RedHat

- name: "HIGH | unix_214248 | Apache web server application directories, libraries, and configuration files must only be accessible to privileged users"
  debug:
    msg:
      - "Below is the list of users with their user levels"
      - "Please review with your ISSO"
      - "{{ passwd_audit }}"
  when:
    - unix_214248
  tags:
    - V-214248
    - cat1
    - high
    - RedHat

- name: "HIGH | unix_214253 | The Apache web server must generate a session ID using as much of the character set as possible to reduce the risk of brute force"
  replace:
    path: /etc/httpd/conf.modules.d/00-base.conf
    regexp: ^#LoadModule unique_id_module modules/mod_unique_id.so
    replace: "LoadModule unique_id_module modules/mod_unique_id.so"
  notify: restart httpd
  when:
    - unix_214253
  tags:
    - V-214253
    - cat1
    - high
    - RedHat

- name: "HIGH | unix_214271 | The account used to run the Apache web server must not have a valid login shell and password defined"
  block:
    - name: "HIGH | unix_214271 | The account used to run the Apache web server must not have a valid login shell and password defined | Find httpd user"
      shell: cat /etc/httpd/conf/httpd.conf | grep 'User ' | cut -f2 -d ' '
      changed_when: false
      register: apache_214271_httpd_users

    - name: "HIGH | unix_214271 | The account used to run the Apache web server must not have a valid login shell and password defined | Apply /sbin/nologin to httpd users"
      user:
        name: "{{ item }}"
        shell: /sbin/nologin
        password_lock: true
      with_items:
        - "{{ apache_214271_httpd_users.stdout_lines }}"
  when:
    - unix_214271
  tags:
    - V-214271
    - cat1
    - high
    - RedHat

- name: "HIGH | unix_214273 | The Apache web server software must be a vendor-supported version"
  block:
    - name: "HIGH | unix_214273 | The Apache web server software must be a vendor-supported version | Get httpd version"
      command: httpd -v
      register: apache_214273_httpd_current_version
      changed_when: false

    - name: "HIGH | unix_214273 | The Apache web server software must be a vendor-supported version | Message out current httpd version"
      debug:
        msg:
          - "Alert! Make sure you are on a vendor supported version of Apache/HTTPD"
          - "The current installed version of httpd is below:"
          - "{{ apache_214273_httpd_current_version.stdout_lines }}"

    - name: "HIGH | unix_214273 | The Apache web server software must be a vendor-supported version | Update httpd"
      yum:
        name: httpd
        state: latest
      when: automate_package_upgrades
  when:
    - unix_214273
  tags:
    - V-214273
    - cat1
    - high
    - RedHat

# CAT II Tasks

- name: "MEDIUM | unix_214228 | The Apache web server must limit the number of allowed simultaneous session requests"
  block:
    - name: "MEDIUM | unix_214228 | The Apache web server must limit the number of allowed simultaneous session requests | Set KeepAlive to on"
      lineinfile:
        path: /etc/httpd/conf/httpd.conf
        regexp: "^KeepAlive "
        line: "KeepAlive On"
        insertafter: ^# Supplemental configuration
      notify: restart httpd

    - name: "MEDIUM | unix_214228 | The Apache web server must limit the number of allowed simultaneous session requests | Set KeepAliveRequests to 100 or more"
      lineinfile:
        path: /etc/httpd/conf/httpd.conf
        regexp: ^MaxKeepAliveRequests
        line: "MaxKeepAliveRequests {{ maxkeepaliverequests_count }}"
        insertafter: ^# Supplemental configuration
      notify: restart httpd
  when:
    - unix_214228
  tags:
    - V-214228
    - cat2
    - medium
    - RedHat

- name: "MEDIUM | unix_214229 | The Apache web server must perform server-side session management"
  block:
    - name: "MEDIUM | unix_214229 | The Apache web server must perform server-side session management | Install Session module"
      yum:
        name: mod_session
        state: present

    - name: "MEDIUM | unix_214229 | The Apache web server must perform server-side session management | Enable usertrack module"
      lineinfile:
        path: /etc/httpd/conf/httpd.conf
        regexp: ^LoadModule usertrack_module modules/mod_usertrack.so
        line: LoadModule usertrack_module modules/mod_usertrack.so
        insertafter: ^# Supplemental configuration
      notify: restart httpd

    - name: "MEDIUM | unix_214229 | The Apache web server must perform server-side session management | Enable session module"
      replace:
        path: /etc/httpd/conf.modules.d/01-session.conf
        regexp: ^#LoadModule session_module modules/mod_session.so
        replace: LoadModule session_module modules/mod_session.so
      notify: restart httpd
  when:
    - unix_214229
  tags:
    - V-214229
    - cat2
    - medium
    - RedHat

- name: |
    "MEDIUM | unix_214230 | The Apache web server must use cryptography to protect the integrity of remote sessions"
    "MEDIUM | unix_214269 | The Apache web server must remove all export ciphers to protect the confidentiality and integrity of transmitted information"
  block:
    - name: |
        "MEDIUM | unix_214230 | The Apache web server must use cryptography to protect the integrity of remote sessions | Install SSL module"
        "MEDIUM | unix_214269 | The Apache web server must remove all export ciphers to protect the confidentiality and integrity of transmitted information | Install SSL module"
      yum:
        name: mod_ssl
        state: present

    - name: |
        "MEDIUM | unix_214230 | The Apache web server must use cryptography to protect the integrity of remote sessions | Apply SSL Porotocol setting"
        "MEDIUM | unix_214269 | The Apache web server must remove all export ciphers to protect the confidentiality and integrity of transmitted information | Apply SSL Protocol setting"
      replace:
        path: /etc/httpd/conf.d/ssl.conf
        regexp: "^(.*?)SSLProtocol.*"
        replace: SSLProtocol -ALL +TLSv1.2

    - name: |
        "MEDIUM | unix_214230 | The Apache web server must use cryptography to protect the integrity of remote sessions | Get SSLCACertificateFile path"
        "MEDIUM | unix_214269 | The Apache web server must remove all export ciphers to protect the confidentiality and integrity of transmitted information | Get SSLCACertificateFile path"
      shell: cat /etc/httpd/conf.d/ssl.conf | grep -h "SSLCACertificateFile" | cut -f2 -d' ' | sed 's|\(.*\)/.*|\1|'
      changed_when: false
      failed_when: false
      register: apache_214269_sslcacertifcatefile_path

    - name: |
        "MEDIUM | unix_214230 | The Apache web server must use cryptography to protect the integrity of remote sessions | Confirm SSLA Cert path"
        "MEDIUM | unix_214269 | The Apache web server must remove all export ciphers to protect the confidentiality and integrity of transmitted information | Confirm SSLA Cert path"
      stat:
        path: "{{ apache_214269_sslcacertifcatefile_path.stdout }}"
      register: apache_214230_sslacert_path_exist

    - name: |
        "MEDIUM | unix_214230 | The Apache web server must use cryptography to protect the integrity of remote sessions | Create path"
        "MEDIUM | unix_214269 | The Apache web server must remove all export ciphers to protect the confidentiality and integrity of transmitted information | Create path"
      file:
        path: "{{ sslacertificatefile_settings.pathrh }}"
        state: directory
      when: not apache_214230_sslacert_path_exist.stat == false

    - name: |
        "MEDIUM | unix_214230 | The Apache web server must use cryptography to protect the integrity of remote sessions | Create SSLA Cert file"
        "MEDIUM | unix_214269 | The Apache web server must remove all export ciphers to protect the confidentiality and integrity of transmitted information | Create SSLA Cert File"
      copy:
        src: "files/{{ sslacertificatefile_settings.file }}"
        dest: "{{ sslacertificatefile_settings.pathrh }}/{{ sslacertificatefile_settings.file }}"
      when: not apache_214230_sslacert_path_exist.stat == false

    - name: |
        "MEDIUM | unix_214230 | The Apache web server must use cryptography to protect the integrity of remote sessions | Set SSLCACertificateFile path"
        "MEDIUM | unix_214269 | The Apache web server must remove all export ciphers to protect the confidentiality and integrity of transmitted information | Set SSLCACertificateFile path"
      replace:
        path: /etc/httpd/conf.d/ssl.conf
        regexp: "^(.*?)SSLCACertificateFile.*"
        replace: "SSLCACertificateFile {{ sslacertificatefile_settings.pathrh }}/{{ sslacertificatefile_settings.file }}"
      notify: restart httpd
      when:
        - apache_214269_sslcacertifcatefile_path.rc == 0

    - name: |
        "MEDIUM | unix_214230 | The Apache web server must use cryptography to protect the integrity of remote sessions | Get CA cert list"
        "MEDIUM | unix_214269 | The Apache web server must remove all export ciphers to protect the confidentiality and integrity of transmitted information | Get CA cert list"
      command: cat {{ sslacertificatefile_settings.pathrh }}/{{ sslacertificatefile_settings.file }}
      changed_when: false
      failed_when: false
      register: apache_214269_ca_bundle_list

    - name: |
        "MEDIUM | unix_214230 | The Apache web server must use cryptography to protect the integrity of remote sessions | List CA cert list"
        "MEDIUM | unix_214269 | The Apache web server must remove all export ciphers to protect the confidentiality and integrity of transmitted information | List CA cert list"
      debug:
        msg:
          - "Alert! Below are the list of CA's, please make sure they are DoD approved"
          - "{{ apache_214269_ca_bundle_list.stdout_lines }}"
      when: apache_214269_ca_bundle_list.stdout != ""

    - name: |
        "MEDIUM | unix_214230 | The Apache web server must use cryptography to protect the integrity of remote sessions | Warn no CA cert list"
        "MEDIUM | unix_214269 | The Apache web server must remove all export ciphers to protect the confidentiality and integrity of transmitted information | Warn no CA cert list"
      debug:
        msg:
          - "Warning! You have no CA's, please remedy"
      when: apache_214269_ca_bundle_list.stdout == ""
  when:
    - unix_214230
    - unix_214269
  tags:
    - V-214230
    - V-214269
    - cat2
    - medium
    - RedHat

- name: "MEDIUM | unix_214231 | The Apache web server must have system logging enabled"
  lineinfile:
    path: /etc/httpd/conf/httpd.conf
    regexp: "   CustomLog "
    line: '    CustomLog "{{ httpd_custom_log.path }}" {{ httpd_custom_log.format }}'
    insertafter: "#CustomLog"
  notify: restart httpd
  when:
    - unix_214231
  tags:
    - V-214231
    - cat2
    - medium
    - RedHat

- name: "MEDIUM |unix_214232 | The Apache web server must generate, at a minimum, log records for system startup and shutdown, system access, and system authentication events"
  lineinfile:
    path: /etc/httpd/conf/httpd.conf
    regexp: "(.*?)# a CustomLog directive (see below)."
    line: '    LogFormat "%a %A %h %H %l %m %s %u %t %U \"%{Referer}i\" " common'
    insertafter: "(.*?)# a CustomLog directive"
  notify: restart httpd
  when:
    - unix_214232
  tags:
    - V-214232
    - cat2
    - medium
    - RedHat

- name: "MEDIUM | unix_214233 | An Apache web server, behind a load balancer or proxy server, must produce log records containing the client IP information as the source and destination and not the load balancer or proxy IP information with each event"
  block:
    - name: "MEDIUM | unix_214233 | An Apache web server, behind a load balancer or proxy server, must produce log records containing the client IP information as the source and destination and not the load balancer or proxy IP information with each event | Get source IP settings"
      shell: cat /etc/httpd/conf/httpd.conf | grep LogFormat
      changed_when: false
      register: apache_214233_source_ip_settings

    - name: "MEDIUM | unix_214233 | An Apache web server, behind a load balancer or proxy server, must produce log records containing the client IP information as the source and destination and not the load balancer or proxy IP information with each event | Display source IP settings"
      debug:
        msg:
          - "Alert! Below are the current source log settings:"
          - "{{ apache_214233_source_ip_settings.stdout_lines }}"
  when:
    - unix_214233
  tags:
    - V-214233
    - cat2
    - medium
    - RedHat

- name: "MEDIUM | unix_214234 | The Apache web server must use a logging mechanism that is configured to alert the Information System Security Officer (ISSO) and System Administrator (SA) in the event of a processing failure"
  debug:
    msg: "Alert! Please work with SIEMA Administrator to configure an alert when no audit data is received from Apache based on defined schedule of connections"
  when:
    - unix_214234
  tags: -V-214234
    - cat2
    - medium
    - RedHat

- name: "MEDIUM | unix_214235 | The Apache web server log files must only be accessible by privileged users"
  block:
    - name: "MEDIUM | unix_214235 | The Apache web server log files must only be accessible by privileged users | Get list of log files"
      command: ls /etc/httpd/logs
      changed_when: false
      register: log_files

    - name: "MEDIUM | unix_214235 | The Apache web server log files must only be accessible by privileged users | Set permissions on log files"
      file:
        path: /etc/httpd/logs/{{ item }}
        owner: "{{ logs_owner.user }}"
        group: "{{ logs_owner.group }}"
        mode: "{{ logs_owner.perms }}"
      with_items:
        - "{{ log_files.stdout_lines }}"
      when: log_files.stdout is defined
  when:
    - unix_214235
  tags:
    - V-214235
    - cat2
    - medium
    - RedHat

- name: "MEDIUM | unix_214236 | The log information from the Apache web server must be protected from unauthorized modification or deletion"
  block:
    - name: Register httpd error log path
      shell: cat /etc/httpd/conf/httpd.conf | grep 'ErrorLog "' | cut -f2 -d ' ' | sed 's/"//g'
      changed_when: false
      register: httpd_error_log_path

    - name: "MEDIUM | unix_214236 | The log information from the Apache web server must be protected from unauthorized modification or deletion | Find log files"
      command: ls /etc/httpd/{{ httpd_error_log_path.stdout }}
      changed_when: false
      failed_when: false
      register: apache_214236_log_files

    - name: "MEDIUM | unix_214236 | The log information from the Apache web server must be protected from unauthorized modification or deletion | Alert Error Log path not configured"
      debug:
        msg: "Warning! The error log path/file are not configured, please address"
      when: apache_214236_log_files.stdout == ""

    - name: "MEDIUM | unix_214236 | The log information from the Apache web server must be protected from unauthorized modification or deletion | Set permissions"
      file:
        path: "/etc/httpd/{{ httpd_error_log_path.stdout }}"
        owner: "{{ logs_owner.user }}"
        mode: "{{ logs_owner.perms }}"
      when: apache_214236_log_files.stdout != ""
  when:
    - unix_214236
  tags:
    - V-214236
    - cat2
    - medium
    - RedHat

- name: "MEDIUM | unix_214237 | The log data and records from the Apache web server must be backed up onto a different system or media"
  debug:
    msg:
      - "Alert! Please interview the Information System Security Officer, System Administrator, Web Manager, Webmaster, or developers as necessary"
      - "to determine whether a tested and verifiable backup strategy has been implemented for web server software and all web server data files."
  when:
    - unix_214237
  tags:
    - V-214237
    - cat2
    - medium
    - RedHat

- name: "MEDIUM | unix_214238 | Expansion modules must be fully reviewed, tested, and signed before they can exist on a production Apache web server"
  block:
    - name: "MEDIUM | unix_214238 | Expansion modules must be fully reviewed, tested, and signed before they can exist on a production Apache web server | Get list of loaded modules"
      command: httpd -M
      failed_when: false
      register: apache_214238_loaded_modules

    - name: "MEDIUM | unix_214238 | Expansion modules must be fully reviewed, tested, and signed before they can exist on a production Apache web server | Get list of assigned modules"
      debug:
        msg:
          - "Alert! Below is the list of loaded modules. Validate that all displayed modules are required for operations."
          - "{{ apache_214238_loaded_modules.stdout_lines }}"
  when:
    - unix_214238
  tags:
    - V-214238
    - cat2
    - medium
    - RedHat

- name: "MEDIUM | unix_214239 | The Apache web server must not perform user management for hosted applications"
  replace:
    path: /etc/httpd/conf/httpd.conf
    regexp: "(.*?)AuthUserFile"
    replace: "# AuthUserFile"
  notify: restart httpd
  when:
    - unix_214239
  tags:
    - V-214239
    - cat2
    - medium
    - RedHat

- name: "MEDIUM | unix_214240 | The Apache web server must only contain services and functions necessary for operation"
  block:
    - name: "MEDIUM | unix_214240 | The Apache web server must only contain services and functions necessary for operation | Register httpd document directory"
      shell: cat /etc/httpd/conf/httpd.conf | grep 'DocumentRoot ' | cut -f2 -d ' ' | cut -f2 -d '"'
      changed_when: false
      register: httpd_doc_dir

    - name: "MEDIUM | unix_214240 | The Apache web server must only contain services and functions necessary for operation | Remove index.html from documents root directory"
      file:
        path: "{{ httpd_doc_dir.stdout }}/index.html"
        state: absent

    - name: "MEDIUM | unix_214240 | The Apache web server must only contain services and functions necessary for operation | Verify Manual content is removed"
      yum:
        name: httpd-manual
        state: absent

    - name: "MEDIUM | unix_214240 | The Apache web server must only contain services and functions necessary for operation | Alert on Server Status handler and Server Information handler"
      debug:
        msg:
          - "Alert! Please review the configuration files and remove/comment out to disable Server Status handler"
          - "Alert! Please review the configuration files and remove/comment out to disable Server Infomration handler"
          - "Alert! Please review the configuration files and remove/comment out to disable any other hanlders such as perl-status"
  when:
    - unix_214240
  tags:
    - V-214240
    - cat2
    - medium
    - RedHat

- name: "MEDIUM | unix_214241 | The Apache web server must not be a proxy server"
  block:
    - name: "MEDIUM | unix_214241 | The Apache web server must not be a proxy server | Remove proxy modules proxy.conf"
      replace:
        path: /etc/httpd/conf.modules.d/00-proxy.conf
        regexp: "^LoadModule {{ item }}"
        replace: "# LoadModule {{ item }}"
      with_items:
        - lbmethod_
        - proxy_

    - name: "MEDIUM | unix_214241 | The Apache web server must not be a proxy server | Remove proxy modules proxy_h2.conf"
      replace:
        path: /etc/httpd/conf.modules.d/10-proxy_h2.conf
        regexp: "^LoadModule proxy_"
        replace: "# LoadModule proxy_"
      when: ansible_distribution_major_version == "8"

    - name: "MEDIUM | unix_214241 | The Apache web server must not be a proxy server | Remove ProxyRequest from config"
      replace:
        path: /etc/httpd/conf/httpd.conf
        regexp: "^ProxyRequests On"
        replace: "ProxyRequests Off"
      notify: restart httpd
  when:
    - unix_214241
  tags:
    - V-214241
    - cat2
    - medium
    - RedHat

- name: "MEDIUM | unix_214243 | The Apache web server must have resource mappings set to disable the serving of certain file types"
  block:
    - name: "MEDIUM | unix_214243 | The Apache web server must have resource mappings set to disable the serving of certain file types | Remove AddHandler settings"
      lineinfile:
        path: /etc/httpd/conf/httpd.conf
        regexp: "(.*?)AddHandler cgi-script {{ item }}"
        state: absent
      with_items:
        - .exe
        - .dll
        - .com
        - .bat
        - .csh

    - name: "MEDIUM | unix_214243 | The Apache web server must have resource mappings set to disable the serving of certain file types | Remove Action settings"
      lineinfile:
        path: /etc/httpd/conf/httpd.conf
        regexp: "(.*?)Action {{ item }}.*"
        state: absent
      with_items:
        - .exe
        - .dll
        - .com
        - .bat
        - .csh
  when:
    - unix_214243
  tags:
    - V-214243
    - cat2
    - medium
    - RedHat

- name: "MEDIUM | unix_214244 | The Apache web server must allow the mappings to unused and vulnerable scripts to be removed"
  block:
    - name: "MEDIUM | unix_214244 | The Apache web server must allow the mappings to unused and vulnerable scripts to be removed | Get Script, ScriptAlias, ScriptAliasMatch, and ScriptInterpreterSource settings"
      shell: cat /etc/httpd/conf/httpd.conf | grep -i "Script" | grep '^[[:blank:]]*[^[:blank:]#;]' | sed -e 's/^[ \t]*//'
      changed_when: false
      register: apache_214244_script_settings

    - name: "MEDIUM | unix_214244 | The Apache web server must allow the mappings to unused and vulnerable scripts to be removed | Alert on script settings"
      debug:
        msg:
          - "Alert! Below are the script settings in place. Please review with ISSO"
          - "and remove any that are not needed"
          - "{{ apache_214244_script_settings.stdout_lines }}"
  when:
    - unix_214244
  tags:
    - V-214244
    - cat2
    - medium
    - RedHat

- name: "MEDIUM | unix_214245 | The Apache web server must have Web Distributed Authoring (WebDAV) disabled"
  block:
    - name: "MEDIUM | unix_214245 | The Apache web server must have Web Distributed Authoring (WebDAV) disabled | Find dav_module location"
      command: grep -rl "dav_module" /etc/httpd
      changed_when: false
      register: apache_214245_dav_mod_location

    - name: "MEDIUM | unix_214245 | The Apache web server must have Web Distributed Authoring (WebDAV) disabled | Adjust modules"
      replace:
        path: "{{ apache_214245_dav_mod_location.stdout }}"
        regexp: "^LoadModule {{ item }}"
        replace: "#LoadModule {{ item }}"
      with_items:
        - dav_module
        - dav_fs_module
        - dav_lock_module
      notify: restart httpd
  when:
    - unix_214245
  tags:
    - V-214245
    - cat2
    - medium
    - RedHat

- name: "MEDIUM | unix_214246 | The Apache web server must be configured to use a specified IP address and port"
  replace:
    path: /etc/httpd/conf/httpd.conf
    regexp: "^Listen(.*?).*"
    replace: "Listen {{ apache_stig_listen_ip_port }}"
  notify: restart httpd
  when:
    - unix_214246
  tags:
    - V-214246
    - cat2
    - medium
    - RedHat

- name: "MEDIUM | unix_214247 | Apache web server accounts accessing the directory tree, the shell, or other operating system functions and utilities must only be administrative accounts"
  debug:
    msg:
      - "Warning! This is an OS level control and should be handled in an OS Role"
  when:
    - unix_214247
  tags:
    - V-214247
    - cat2
    - medium
    - RedHat

- name: "MEDIUM | unix_214249 | The Apache web server must separate the hosted applications from hosted Apache web server management functionality"
  command: /bin/true
  changed_when: false
  when:
    - unix_214249
  tags:
    - V-214249
    - cat2
    - medium
    - RedHat
    - notimplemented

- name: "MEDIUM | unix_214250 | The Apache web server must invalidate session identifiers upon hosted application user logout or other session termination"
  lineinfile:
    path: /etc/httpd/conf/httpd.conf
    regexp: "^SessionMaxAge(.*?).*"
    line: "SessionMaxAge {{ session_max_age }}"
    insertafter: ^# Supplemental configuration
  notify: restart httpd
  when:
    - unix_214250
  tags:
    - V-214250
    - cat2
    - medium
    - RedHat

# The restart task is to force the httpd.pid file to show up. During testing I found intermittenly it was not created with the initial restart, this made it exist consistently.
- name: |
    "MEDIUM | unix_214251 | Cookies exchanged between the Apache web server and client, such as session cookies, must have security settings that disallow cookie access outside the originating Apache web server and hosted application"
    "MEDIUM | unix_214268 | Cookies exchanged between the Apache web server and the client, such as session cookies, must have cookie properties set to prohibit client-side scripts from reading the cookie data"
  block:
    - name: |
        "MEDIUM | unix_214251 | Cookies exchanged between the Apache web server and client, such as session cookies, must have security settings that disallow cookie access outside the originating Apache web server and hosted application | Restart httpd service"
        "MEDIUM | unix_214268 | Cookies exchanged between the Apache web server and the client, such as session cookies, must have cookie properties set to prohibit client-side scripts from reading the cookie data | Restart httpd service"
      service:
        name: httpd
        state: restarted

    - name: |
        "MEDIUM | unix_214251 | Cookies exchanged between the Apache web server and client, such as session cookies, must have security settings that disallow cookie access outside the originating Apache web server and hosted application | Check for headers module
        "MEDIUM | unix_214268 | Cookies exchanged between the Apache web server and the client, such as session cookies, must have cookie properties set to prohibit client-side scripts from reading the cookie data | Check for eaders module"
      shell: httpd -M | grep -i 'headers_module (shared)'
      changed_when: false
      register: apache_214251_headers_module_enabled

    - name: |
        "MEDIUM | unix_214251 | Cookies exchanged between the Apache web server and client, such as session cookies, must have security settings that disallow cookie access outside the originating Apache web server and hosted application | Install Headers module"
        "MEDIUM | unix_214268 | Cookies exchanged between the Apache web server and the client, such as session cookies, must have cookie properties set to prohibit client-side scripts from reading the cookie data | Install Headers module"
      debug:
        msg:
          - "Warning! You do not have the headers module enabled, please Install"
      when: "'headers_module (shared)' not in apache_214251_headers_module_enabled.stdout"

    - name: |
        "MEDIUM | unix_214251 | Cookies exchanged between the Apache web server and client, such as session cookies, must have security settings that disallow cookie access outside the originating Apache web server and hosted application | Register no HttpOnly and secure"
        "MEDIUM | unix_214268 | Cookies exchanged between the Apache web server and the client, such as session cookies, must have cookie properties set to prohibit client-side scripts from reading the cookie data | Register no HttpOnly and secure"
      shell: cat /etc/httpd/conf/httpd.conf | grep -i "sessioncookiename" | grep -ivE 'httponly|secure' | sed 's/^[ \t]*//;s/[ \t]*$//'
      changed_when: false
      register: apache_214251_no_httponly_secure

    - name: |
        "MEDIUM | unix_214251 | Cookies exchanged between the Apache web server and client, such as session cookies, must have security settings that disallow cookie access outside the originating Apache web server and hosted application | Register only HttpOnly"
        "MEDIUM | unix_214268 | Cookies exchanged between the Apache web server and the client, such as session cookies, must have cookie properties set to prohibit client-side scripts from reading the cookie data | Register only HttpOnly"
      shell: cat /etc/httpd/conf/httpd.conf | grep -i "sessioncookiename" | grep -i 'httponly' | grep -v 'secure' | sed 's/^[ \t]*//;s/[ \t]*$//'
      changed_when: false
      register: apache_214251_no_secure_only
      when: apache_214251_no_httponly_secure.stdout == ""

    - name: |
        "MEDIUM | unix_214251 | Cookies exchanged between the Apache web server and client, such as session cookies, must have security settings that disallow cookie access outside the originating Apache web server and hosted application | Register only secure"
        "MEDIUM | unix_214268 | Cookies exchanged between the Apache web server and the client, such as session cookies, must have cookie properties set to prohibit client-side scripts from reading the cookie data | Register only secure"
      shell: cat /etc/httpd/conf/httpd.conf | grep -i "sessioncookiename" | grep -i 'secure' | grep -iv 'httponly' | sed 's/^[ \t]*//;s/[ \t]*$//'
      changed_when: false
      register: apache_214251_no_httponly_only
      when: apache_214251_no_httponly_secure.stdout == ""

    - name: |
        "MEDIUM | unix_214251 | Cookies exchanged between the Apache web server and client, such as session cookies, must have security settings that disallow cookie access outside the originating Apache web server and hosted application | Add both HttpOnly and secure"
        "MEDIUM | unix_214268 | Cookies exchanged between the Apache web server and the client, such as session cookies, must have cookie properties set to prohibit client-side scripts from reading the cookie data | Add both HttpOnly and secure"
      lineinfile:
        path: /etc/httpd/conf/httpd.conf
        regexp: "(.*?)SessionCookieName.*"
        line: "    {{ apache_214251_no_httponly_secure.stdout }};HttpOnly;secure"
      when: apache_214251_no_httponly_secure.stdout != ""
      notify: restart httpd

    - name: |
        "MEDIUM | unix_214251 | Cookies exchanged between the Apache web server and client, such as session cookies, must have security settings that disallow cookie access outside the originating Apache web server and hosted application | Add secure"
        "MEDIUM | unix_214268 | Cookies exchanged between the Apache web server and the client, such as session cookies, must have cookie properties set to prohibit client-side scripts from reading the cookie data | Add secure"
      lineinfile:
        path: /etc/httpd/conf/httpd.conf
        regexp: "(.*?)SessionCookieName.*"
        line: "    {{ apache_214251_no_secure_only.stdout }};secure"
      when:
        - apache_214251_no_httponly_secure.stdout == ""
        - apache_214251_no_secure_only.stdout != ""
      notify: restart httpd

    - name: |
        "MEDIUM | unix_214251 | Cookies exchanged between the Apache web server and client, such as session cookies, must have security settings that disallow cookie access outside the originating Apache web server and hosted application | Add HttpOnly"
        "MEDIUM | unix_214268 | Cookies exchanged between the Apache web server and the client, such as session cookies, must have cookie properties set to prohibit client-side scripts from reading the cookie data | Add HttpOnly"
      lineinfile:
        path: /etc/httpd/conf/httpd.conf
        regexp: "(.*?)SessionCookieName.*"
        line: "    {{ apache_214251_no_httponly_only.stdout }};HttpOnly"
      when:
        - apache_214251_no_httponly_secure.stdout == ""
        - apache_214251_no_httponly_only.stdout != ""
      notify: restart httpd

    - name: "MEDIUM | unix_214268 | Cookies exchanged between the Apache web server and the client, such as session cookies, must have cookie properties set to prohibit client-side scripts from reading the cookie data | Set Session On"
      replace:
        path: /etc/httpd/conf/httpd.conf
        regexp: "    Session .*"
        replace: "    Session On"
      notify: restart httpd

    - name: |
        "MEDIUM | unix_214251 | Cookies exchanged between the Apache web server and client, such as session cookies, must have security settings that disallow cookie access outside the originating Apache web server and hosted application | Enable Request Module"
        "MEDIUM | unix_214268 | Cookies exchanged between the Apache web server and the client, such as session cookies, must have cookie properties set to prohibit client-side scripts from reading the cookie data | Enable Request Module"
      replace:
        path: /etc/httpd/conf.modules.d/00-base.conf
        regexp: "^#LoadModule request_module modules/mod_request.so"
        replace: "LoadModule request_module modules/mod_request.so"
      notify: restart httpd
  when:
    - unix_214251
    - unix_214268
  tags:
    - V-214251
    - V-214268
    - cat2
    - medium
    - RedHat

# The base package does not contain the apr_crypto_openssl module, which is in the apr-util-openssl package. The default repo does not contain the apr-util-openssl
# That is the reason we add a repo (Offiical RedHat repo) and install apr-util-openssl
# Here is the bug ticket for this item https://bugzilla.redhat.com/show_bug.cgi?id=1633152

- name: "MEDIUM | unix_214252 | The Apache web server must generate a session ID long enough that it cannot be guessed through brute force"
  block:
    - name: "MEDIUM | unix_214252 | The Apache web server must generate a session ID long enough that it cannot be guessed through brute force | Add rhel-7-server-optional-rpms repo for apr-util-openssl"
      command: subscription-manager repos --enable rhel-7-server-optional-rpms
      when: ansible_distribution_major_version == "8"

    - name: "MEDIUM | unix_214252 | The Apache web server must generate a session ID long enough that it cannot be guessed through brute force | Install apr-util-openssl"
      yum:
        name: apr-util-openssl
        state: present

    - name: "MEDIUM | unix_214252 | The Apache web server must generate a session ID long enough that it cannot be guessed through brute force | Enable the session_crypto_module"
      replace:
        path: /etc/httpd/conf.modules.d/01-session.conf
        regexp: "^#LoadModule session_crypto_module"
        replace: "LoadModule session_crypto_module"

    - name: "MEDIUM | unix_214252 | The Apache web server must generate a session ID long enough that it cannot be guessed through brute force | set SessionCryptoCipher"
      lineinfile:
        path: /etc/httpd/conf/httpd.conf
        regexp: "^SessionCryptoCipher(.*?).*"
        line: "SessionCryptoCipher aes256"
        insertafter: ^# Supplemental configuration
      notify: restart httpd
  when:
    - unix_214252
  tags:
    - V-214252
    - cat2
    - medium
    - RedHat

- name: "MEDIUM | unix_214254 | The Apache web server must be built to fail to a known safe state if system initialization fails, shutdown fails, or aborts fail"
