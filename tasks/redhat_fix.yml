- name: "MEDIUM | unix_214258 | The Apache web server must set an inactive timeout for sessions"
  block:
    - name: "MEDIUM | unix_214258 | The Apache web server must set an inactive timeout for sessions | Enable reqtimeout_module"
      replace:
        path: /etc/httpd/conf.modules.d/00-base.conf
        regexp: "^#LoadModule reqtimeout_module modules/mod_reqtimeout.so"
        replace: LoadModule reqtimeout_module modules/mod_reqtimeout.so
      notify: restart httpd

    - name: "MEDIUM | unix_214258 | The Apache web server must set an inactive timeout for sessions | Set RequestReadTimeout"
      lineinfile:
