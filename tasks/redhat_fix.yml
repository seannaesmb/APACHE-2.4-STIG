- name: "MEDIUM | unix_214270 | The Apache web server must install security-relevant software updates within the configured time period directed by an authoritative source (e.g., IAVM, CTOs, DTMs, and STIGs)"
  block:
    - name: "MEDIUM | unix_214270 | The Apache web server must install security-relevant software updates within the configured time period directed by an authoritative source (e.g., IAVM, CTOs, DTMs, and STIGs) | Check installed version number"
      shell: httpd -v | grep -i "version" | cut -f2 -d/ | cut -f1 -d'(' | sed 's/^[ \t]*//;s/[ \t]*$//'
      changed_when: false
      register: apache_214270_apache_version

    - name: "MEDIUM | unix_214270 | The Apache web server must install security-relevant software updates within the configured time period directed by an authoritative source (e.g., IAVM, CTOs, DTMs, and STIGs) | Check available version number"
      shell: yum info httpd | grep -i "version" | cut -f2 -d':' | sed 's/^[ \t]*//;s/[ \t]*$//'
      changed_when: false
      register: apache_214270_apache_version_available

    - name: "MEDIUM | unix_214270 | The Apache web server must install security-relevant software updates within the configured time period directed by an authoritative source (e.g., IAVM, CTOs, DTMs, and STIGs) | Alert you are on the latest"
      debug:
        msg:
          - "Good News! You are on the latest version of Apache"
      when: apache_214270_apache_version.stdout == apache_214270_apache_version_available.stdout

    - name: "MEDIUM | unix_214270 | The Apache web server must install security-relevant software updates within the configured time period directed by an authoritative source (e.g., IAVM, CTOs, DTMs, and STIGs) | Alert you are not on the latest"
      debug:
        msg:
          - "Alert! You are NOT on the latest version of Apache. You should be no more than 1 version behind"
          - "Installed version: {{ apache_214270_apache_version.stdout }}"
          - "Available version: {{ apache_214270_apache_version_available.stdout }}"
      when: apache_214270_apache_version.stdout != apache_214270_apache_version_available.stdout

    - name: "MEDIUM | unix_214270 | The Apache web server must install security-relevant software updates within the configured time period directed by an authoritative source (e.g., IAVM, CTOs, DTMs, and STIGs) | Update to latest"
      yum:
        name: httpd
        state: latest
      when:
        - apache_214270_apache_version.stdout != apache_214270_apache_version_available.stdout
        - automate_apache_version_update
  when:
    - unix_214270
  tags:
    - V-214270
    - cat2
    - medium
    - RedHat

