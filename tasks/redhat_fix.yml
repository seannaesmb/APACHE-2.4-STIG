- name: "MEDIUM | unix_214259 | The Apache web server must restrict inbound connections from nonsecure zones"
  block:
    - name: "MEDIUM | unix_214259 | The Apache web server must restrict inbound connections from nonsecure zones | Check for configs"
      shell: cat /etc/httpd/conf/httpd.conf | grep -i "RequireAll"
      changed_when: false
      failed_when: false
      register: apache_214259_requireall_exist

    - name: "MEDIUM | unix_214259 | The Apache web server must restrict inbound connections from nonsecure zones | Alert on configs"
      debug:
        msg:
          - "Alert! You have RequireAll configured. Please review settings"
          - "If RequireAll is not configured or IP ranges configured to allow are not restrictive enough to prevent connections"
          - "from nonsecure zones, this is a finding."
      when: apache_214259_requireall_exist.rc == 0

    - name: "MEDIUM | unix_214259 | The Apache web server must restrict inbound connections from nonsecure zones | Insert Settings"
      blockinfile:
        path: /etc/httpd/conf/httpd.conf
        block: "{{ requireall_settings }}"
        marker: "# {mark} RequireAll ANSIBLE MANAGED BLOCK"
        insertbefore: ^# Supplemental configuration
      when: apache_214259_requireall_exist.rc == 1
      notify: restart httpd
  when:
    - unix_214259
    - not host_based_firewall
  tags:
    - V-214259
    - cat2
    - medium
    - RedHat

