- name: |
    "MEDIUM | unix_214266 | The Apache web server must prohibit or restrict the use of nonsecure or unnecessary ports, protocols, modules, and/or services"
    "LOW | unix_214272 | The Apache web server must be configured in accordance with the security configuration settings based on DoD security configuration or implementation guidance, including STIGs, NSA configuration guides, CTOs, and DTMs"
  block:
    - name: |
        "MEDIUM | unix_214266 | The Apache web server must prohibit or restrict the use of nonsecure or unnecessary ports, protocols, modules, and/or services | Get httpd Listen port"
        "LOW | unix_214272 | The Apache web server must be configured in accordance with the security configuration settings based on DoD security configuration or implementation guidance, including STIGs, NSA configuration guides, CTOs, and DTMs | Get httpd Listen port"
      shell: cat /etc/apache2/ports.conf | grep "Listen" | grep -v "#"
      changed_when: false
      failed_when: false
      register: apache_214266_httpd_listenPort

    - name: |
        "MEDIUM | unix_214266 | The Apache web server must prohibit or restrict the use of nonsecure or unnecessary ports, protocols, modules, and/or services | Get Virutal Host ports"
        "LOW | unix_214272 | The Apache web server must be configured in accordance with the security configuration settings based on DoD security configuration or implementation guidance, including STIGs, NSA configuration guides, CTOs, and DTMs | Get Virutal Host ports"
      shell: cat /etc/apache2/sites-enabled/000-default.conf | grep "VirtualHost" | grep -v "#"
      changed_when: false
      failed_when: false
      register: apache_214266_vhost_port

    - name: |
        "MEDIUM | unix_214266 | The Apache web server must prohibit or restrict the use of nonsecure or unnecessary ports, protocols, modules, and/or services | Alert on ports used"
        "LOW | unix_214272 | The Apache web server must be configured in accordance with the security configuration settings based on DoD security configuration or implementation guidance, including STIGs, NSA configuration guides, CTOs, and DTMs | Alert on ports used"
      debug:
        msg:
          - "Alert! Below are the ports being used for the webserver. Make sure they adhere to IANA well known ports"
          - "Apache2 Listen ports: {{ apache_214266_httpd_listenPort.stdout_lines }}"
          - "Apache2 virtual hosts ports: {{ apache_214266_vhost_port.stdout_lines }}"
  when:
    - unix_214266 or unix_214272
  tags:
    - V-214266
    - V-214272
    - cat2
    - medium
    - Ubuntu

