      lineinfile:
        path: /etc/apache2/apache2.conf
        regexp: "^LogLevel(.*?).*"
        line: "LogLevel info"
        insertbefore: ^# Include module configuration
      notify: restart apache2

    - name: "MEDIUM | unix_214257 | Debugging and trace information used to diagnose the Apache web server must be disabled | Set TraceEnable"
      lineinfile:
        path: /etc/apache2/apache2.conf
        regexp: "^TraceEnable(.*?).*"
        line: "TraceEnable Off"
        insertafter: "^LogLevel "
      notify: restart apache2
  when:
    - unix_214257
  tags:
    - V-214257
    - cat2
    - medium
    - Ubuntu

