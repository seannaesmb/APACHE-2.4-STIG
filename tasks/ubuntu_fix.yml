---
- name: "HIGH | unix_214242 | The Apache web server must provide install options to exclude the installation of documentation, sample code, example applications, and tutorials"
  block:
    - name: "HIGH | unix_214242 | The Apache web server must provide install options to exclude the installation of documentation, sample code, example applications, and tutorials | List available sites"
      command: ls /etc/apache2/sites-available
      register: unix_214242_apache_sites
      changed_when: false

    - name: "HIGH | unix_214242 | The Apache web server must provide install options to exclude the installation of documentation, sample code, example applications, and tutorials | Display available sites"
      debug:
        msg:
          - "Below is the list of available sites"
          - "review your /etc/Apache2 folder with your ISSO for approval"
          - "{{ unix_214242_apache_sites.stdout_lines }}"
  when:
    - unix_214242
  tags:
    - V-214242
    - cat1
    - high
    - Ubuntu

- name: "HIGH | unix_214248 | Apache web server application directories, libraries, and configuration files must only be accessible to privileged users."
  debug:
    msg:
      - "Below is the list of users with their user levels"
      - "Please review with your ISSO"
      - "{{ passwd_audit }}"
  when:
    - unix_214248
  tags:
    - V-214248
    - cat1
    - high
    - Ubuntu

- name: HIGH | unix_214253 | The Apache web server must generate a session ID using as much of the character set as possible to reduce the risk of brute force. | Alert no httpd"
  command: a2enmod unique_id
  notify: restart apache2
  when:
    - unix_214253
  tags:
    - V-214253
    - cat1
    - high
    - Ubuntu

- name: "HIGH | unix_214271 | The account used to run the Apache web server must not have a valid login shell and password defined"
  block:
    - name: "HIGH | unix_214271 | The account used to run the Apache web server must not have a valid login shell and password defined | Find apache users"
      shell: cat /etc/apache2/envvars | grep APACHE_RUN_USER | cut -f2 -d=
      changed_when: false
      register: apache_users

    - name: "HIGH | unix_214271 | The account used to run the Apache web server must not have a valid login shell and password defined | Apply /sbin/nologin to apache users"
      user:
        name: "{{ item }}"
        shell: /sbin/nologin
      with_items:
        - "{{ apache_users.stdout_lines }}"
  when:
    - unix_214271
  tags:
    - V-214271
    - cat1
    - high
    - Ubuntu

- name: "HIGH | unix_214273 | The Apache web server software must be a vendor-supported version"
  block:
    - name: "HIGH | unix_214273 | The Apache web server software must be a vendor-supported version | Get Apache version"
      command: apachectl -v
      register: apache_current_version
      changed_when: false

    - name: "HIGH | unix_214273 | The Apache web server software must be a vendor-supported version | Message out current Apache version"
      debug:
        msg:
          - "Alert! The current version of Apache is below:"
          - "{{ apache_current_version }}"

    - name: "HIGH | unix_214273 | The Apache web server software must be a vendor-supported version | Update Apache"
      yum:
        name: apache2
        state: latest
      when: automate_package_upgrades
  when:
    - unix_214273
  tags:
    - V-214273
    - cat1
    - high
    - Ubuntu

# CAT II Tasks

- name: "MEDIUM | unix_214228 | The Apache web server must limit the number of allowed simultaneous session requests"
  block:
    - name: "MEDIUM | unix_214228 | The Apache web server must limit the number of allowed simultaneous session requests | Set KeepAlive to on"
      lineinfile:
        path: /etc/apache2/apache2.conf
        regexp: "^KeepAlive "
        line: "KeepAlive On"
        insertafter: EOF
      notify: restart apache2

    - name: "MEDIUM | unix_214228 | The Apache web server must limit the number of allowed simultaneous session requests | Set KeepAliveRequests to 100 or more"
      lineinfile:
        path: /etc/apache2/apache2.conf
        regexp: ^MaxKeepAliveRequests
        line: "MaxKeepAliveRequests {{ maxkeepaliverequests_count }}"
        insertafter: EOF
      notify: restart apache2
  when:
    - unix_214228
  tags:
    - V-214228
    - cat2
    - medium
    - Ubuntu

- name: "MEDIUM | unix_214229 | The Apache web server must perform server-side session management"
  command: a2enmod {{ item }}
  register: apache_214229_mod_enabled
  changed_when: "'Enabling' in apache_214229_mod_enabled.stdout"
  with_items:
    - usertrack
    - session
  when:
    - unix_214229
  tags:
    - V-214229
    - cat2
    - medium
    - Ubuntu

- name: |
    "MEDIUM | unix_214230 | The Apache web server must use cryptography to protect the integrity of remote sessions"
    "MEDIUM | unix_214269 | The Apache web server must remove all export ciphers to protect the confidentiality and integrity of transmitted information"
  block:
    - name: |
        "MEDIUM | unix_214230 | The Apache web server must use cryptography to protect the integrity of remote sessions | Install SSL and socache_shmcb modules"
        "MEDIUM | unix_214269 | The Apache web server must remove all export ciphers to protect the confidentiality and integrity of transmitted information | Install SSL and socache_shmcb modules"
      command: "a2enmod {{ item }}"
      register: apache_214230_mod_enabled
      changed_when: "'Enabling' in apache_214230_mod_enabled.stdout"
      with_items:
        - socache_shmcb
        - ssl

    - name: |
        "MEDIUM | unix_214230 | The Apache web server must use cryptography to protect the integrity of remote sessions | Set SSL Setting""
        "MEDIUM | unix_214269 | The Apache web server must remove all export ciphers to protect the confidentiality and integrity of transmitted information| Set SSL Setting"
      lineinfile:
        path: /etc/apache2/mods-enabled/ssl.conf
        regexp: "(.*?)SSLProtocol.*"
        line: "        SSLProtocol -ALL +TLSv1.2"
        insertbefore: "</IfModule>"

    - name: |
        "MEDIUM | unix_214230 | The Apache web server must use cryptography to protect the integrity of remote sessions | Get SSLCACertificateFile path"
        "MEDIUM | unix_214269 | The Apache web server must remove all export ciphers to protect the confidentiality and integrity of transmitted information | Get SSLCACertificateFile path"
      shell: cat /etc/apache2/sites-available/default-ssl.conf | grep -h "SSLCACertificateFile" | grep -v '#' | sed 's/^[ \t]*//;s/[ \t]*$//' | cut -f2 -d ' '
      changed_when: false
      failed_when: false
      register: apache_214269_sslcacertifcatefile_path

    - name: |
        "MEDIUM | unix_214230 | The Apache web server must use cryptography to protect the integrity of remote sessions | Set SSLCACertificateFile parameter"
        "MEDIUM | unix_214269 | The Apache web server must remove all export ciphers to protect the confidentiality and integrity of transmitted information | Set SSLCACertificateFile parameter"
      lineinfile:
        path: /etc/apache2/sites-available/default-ssl.conf
        regexp: "(.*?)SSLCACertificateFile.*"
        line: "                SSLCACertificateFile {{ sslacertificatefile_settings.pathub }}/{{ sslacertificatefile_settings.file }}"
        insertafter: "(.*?)</Directory>"
      when: apache_214269_sslcacertifcatefile_path.stdout == ""

    - name: |
        "MEDIUM | unix_214230 | The Apache web server must use cryptography to protect the integrity of remote sessions | Get SSLCACertificateFile path"
        "MEDIUM | unix_214269 | The Apache web server must remove all export ciphers to protect the confidentiality and integrity of transmitted information | Get SSLCACertificateFile path"
      shell: cat /etc/apache2/sites-available/default-ssl.conf | grep -h "SSLCACertificateFile" | grep -v '#' | sed 's/^[ \t]*//;s/[ \t]*$//' | cut -f2 -d ' '
      changed_when: false
      failed_when: false
      register: apache_214269_sslcacertifcatefile_path

    - name: |
        "MEDIUM | unix_214230 | The Apache web server must use cryptography to protect the integrity of remote sessions | Get CA cert list"
        "MEDIUM | unix_214269 | The Apache web server must remove all export ciphers to protect the confidentiality and integrity of transmitted information | Get CA cert list"
      command: cat {{ apache_214269_sslcacertifcatefile_path.stdout }}
      changed_when: false
      failed_when: false
      register: apache_214269_ca_bundle_list
      when: apache_214269_sslcacertifcatefile_path.stdout != ""

    - name: |
        "MEDIUM | unix_214230 | The Apache web server must use cryptography to protect the integrity of remote sessions | List CA cert list"
        "MEDIUM | unix_214269 | The Apache web server must remove all export ciphers to protect the confidentiality and integrity of transmitted information | List CA cert list"
      debug:
        msg:
          - "Alert! Below are the list of CA's, please make sure they are DoD approved"
          - "{{ apache_214269_ca_bundle_list.stdout_lines }}"
      when: apache_214269_ca_bundle_list.stdout != ""

    - name: |
        "MEDIUM | unix_214230 | The Apache web server must use cryptography to protect the integrity of remote sessions | Warn no CA cert list"
        "MEDIUM | unix_214269 | The Apache web server must remove all export ciphers to protect the confidentiality and integrity of transmitted information | Warn no CA cert list"
      debug:
        msg:
          - "Warning! You have no CA's, please remedy"
      when: apache_214269_ca_bundle_list.stdout == ""
  when:
    - unix_214230
    - unix_214269
  tags:
    - V-214230
    - V-214269
    - cat2
    - medium
    - Ubuntu

- name: "MEDIUM | unix_214231 | The Apache web server must have system logging enabled"
  lineinfile:
    path: /etc/apache2/envvars
    regexp: "^export APACHE_LOG_DIR="
    line: "export APACHE_LOG_DIR={{ apache2_custom_log.path }}$SUFFIX"
    insertafter: "# Only /var/log/apache2"
  notify: restart apache2
  when:
    - unix_214231
  tags:
    - V-214231
    - cat2
    - medium
    - Ubuntu

- name: "MEDIUM |unix_214232 | The Apache web server must generate, at a minimum, log records for system startup and shutdown, system access, and system authentication events"
  lineinfile:
    path: /etc/apache2/apache2.conf
    regexp: "# Use mod_remoteip instead"
    line: 'LogFormat "%a %A %h %H %l %m %s %t %u %U \"%{Referer}i\" " common'
    insertafter: "# Use mod_remoteip instead"
  notify: restart apache2
  when:
    - unix_214232
  tags:
    - V-214232
    - cat2
    - medium
    - Ubuntu

- name: "MEDIUM | unix_214233 | An Apache web server, behind a load balancer or proxy server, must produce log records containing the client IP information as the source and destination and not the load balancer or proxy IP information with each event"
  block:
    - name: "MEDIUM | unix_214233 | An Apache web server, behind a load balancer or proxy server, must produce log records containing the client IP information as the source and destination and not the load balancer or proxy IP information with each event | Get source IP settings"
      shell: cat /etc/apache2/apache2.conf | grep LogFormat
      changed_when: false
      register: source_ip_settings

    - name: "MEDIUM | unix_214233 | An Apache web server, behind a load balancer or proxy server, must produce log records containing the client IP information as the source and destination and not the load balancer or proxy IP information with each event | Display source IP settings"
      debug:
        msg:
          - "Alert! Below are the current source log settings:"
          - "{{ source_ip_settings.stdout_lines }}"
  when:
    - unix_214233
  tags:
    - V-214233
    - cat2
    - medium
    - Ubuntu

- name: "MEDIUM | unix_214234 | The Apache web server must use a logging mechanism that is configured to alert the Information System Security Officer (ISSO) and System Administrator (SA) in the event of a processing failure"
  debug:
    msg: "Alert! Please work with SIEMA Administrator to configure an alert when no audit data is received from Apache based on defined schedule of connections"
  when:
    - unix_214234
  tags: -V-214234
    - cat2
    - medium
    - Ubuntu

- name: "MEDIUM | unix_214235 | The Apache web server log files must only be accessible by privileged users"
  block:
    - name: "MEDIUM | unix_214235 | The Apache web server log files must only be accessible by privileged users |Register apache2 log paths"
      shell: cat /etc/apache2/envvars | grep APACHE_LOG_DIR | cut -f2 -d= | cut -f1 -d$
      changed_when: false
      register: apache2_log_path

    - name: "MEDIUM | unix_214235 | The Apache web server log files must only be accessible by privileged users | Check for log files"
      stat:
        path: "/etc/apache2/{{ apache2_log_path.stdout }}"
      register: apache_214235_log_path_exist

    - name: "MEDIUM | unix_214235 | The Apache web server log files must only be accessible by privileged users | Create if folder exists"
      file:
        path: "/etc/apache2/{{ apache2_log_path.stdout }}"
        state: directory
      when: apache_214235_log_path_exist.stat.exists == false

    - name: "MEDIUM | unix_214235 | The Apache web server log files must only be accessible by privileged users | Restart apache2 to create default log files"
      service:
        name: apache2
        state: restarted
      when: apache_214235_log_path_exist.stat.exists == false

    - name: "MEDIUM | unix_214235 | The Apache web server log files must only be accessible by privileged users | Get list of log files"
      command: "ls /etc/apache2/{{ apache2_log_path.stdout }}"
      changed_when: false
      register: apache_214235_log_files

    - name: "MEDIUM | unix_214235 | The Apache web server log files must only be accessible by privileged users | Set permissions on log files"
      file:
        path: "/etc/apache2/{{ apache2_log_path.stdout }}/{{ item }}"
        owner: "{{ logs_owner.user }}"
        group: "{{ logs_owner.group }}"
        mode: "{{ logs_owner.perms }}"
      with_items:
        - "{{ apache_214235_log_files.stdout_lines }}"
      when: log_files.stdout is defined
  when:
    - unix_214235
  tags:
    - V-214235
    - cat2
    - medium
    - Ubuntu

- name: "MEDIUM | unix_214236 | The log information from the Apache web server must be protected from unauthorized modification or deletion"
  block:
    - name: "MEDIUM | unix_214236 | The log information from the Apache web server must be protected from unauthorized modification or deletion | Find log files"
      shell: cat /etc/apache2/apache2.conf | grep 'ErrorLog ${' | cut -f2 -d}
      changed_when: false
      register: apache_214236_log_files

    - name: "MEDIUM | unix_214236 | The log information from the Apache web server must be protected from unauthorized modification or deletion | Set permissions"
      file:
        path: "/etc/apache2/{{ apache2_log_path.stdout }}{{ item }}"
        owner: "{{ logs_owner.user }}"
        mode: "{{ logs_owner.perms }}"
      with_items:
        - "{{ apache_214236_log_files.stdout_lines }}"
  when:
    - unix_214236
  tags:
    - V-214236
    - cat2
    - medium
    - Ubuntu

- name: "MEDIUM | unix_214237 | The log data and records from the Apache web server must be backed up onto a different system or media"
  debug:
    msg:
      - "Alert! Please interview the Information System Security Officer, System Administrator, Web Manager, Webmaster, or developers as necessary"
      - "to determine whether a tested and verifiable backup strategy has been implemented for web server software and all web server data files."
  when:
    - unix_214237
  tags:
    - V-214237
    - cat2
    - medium
    - Ubuntu

- name: "MEDIUM | unix_214238 | Expansion modules must be fully reviewed, tested, and signed before they can exist on a production Apache web server"
  block:
    - name: "MEDIUM | unix_214238 | Expansion modules must be fully reviewed, tested, and signed before they can exist on a production Apache web server | Get list of loaded modules"
      command: apachectl -M
      register: apache_214238_loaded_modules

    - name: "MEDIUM | unix_214238 | Expansion modules must be fully reviewed, tested, and signed before they can exist on a production Apache web server | Get list of assigned modules"
      debug:
        msg:
          - "Alert! Below is the list of loaded modules. Please review and remove any unsigned modules"
          - "{{ apache_214238_loaded_modules.stdout_lines }}"
  when:
    - unix_214238
  tags:
    - V-214238
    - cat2
    - medium
    - Ubuntu

- name: "MEDIUM | unix_214239 | The Apache web server must not perform user management for hosted applications"
  replace:
    path: /etc/apache2/apache2.conf
    regexp: "(.*?)AuthUserFile"
    replace: "# AuthUserFile"
  notify: restart apache2
  when:
    - unix_214239
  tags:
    - V-214239
    - cat2
    - medium
    - Ubuntu

- name: "MEDIUM | unix_214240 | The Apache web server must only contain services and functions necessary for operation"
  block:
    - name: Register Apache2 document directory
      shell: "grep -R DocumentRoot /etc/apache2/sites-enabled/ | cut -f2 -d : | cut -f2 -d ' '"
      changed_when: false
      register: apache2_doc_dir

    - name: "The Apache web server must only contain services and functions necessary for operation | Remove index.html from documents root directory"
      file:
        path: "{{ apache2_doc_dir.stdout }}/index.html"
        state: absent

    - name: "MEDIUM | unix_214240 | The Apache web server must only contain services and functions necessary for operation | Verify Manual content is removed"
      apt:
        name: apache2-doc
        state: absent

    - name: "MEDIUM | unix_214240 | The Apache web server must only contain services and functions necessary for operation | Alert on Server Status handler and Server Information handler"
      debug:
        msg:
          - "Alert! Please review the configuration files and remove/comment out to disable Server Status handler"
          - "Alert! Please review the configuration files and remove/comment out to disable Server Infomration handler"
          - "Alert! Please review the configuration files and remove/comment out to disable any other hanlders such as perl-status"
  when:
    - unix_214240
  tags:
    - V-214240
    - cat2
    - medium
    - Ubuntu

- name: "MEDIUM | unix_214241 | The Apache web server must not be a proxy server"
  command: a2dismod "{{ item }}"
  register: apache_214241_mod_disabled
  changed_when: "'Already' not in apache_214241_mod_disabled.stdout"
  with_items:
    - proxy
    - proxy_ajp
    - proxy_balancer
    - proxy_ftp
    - proxy_http
    - proxy_connect
  when:
    - unix_214241
  tags:
    - V-214241
    - cat2
    - medium
    - Ubuntu

- name: "MEDIUM | unix_214242 | The Apache web server must provide install options to exclude the installation of documentation, sample code, example applications, and tutorials"
  debug:
    msg:
      - "Alert! Please review and remove any unnecessary applications per ISSO documentation"
  when:
    - unix_214242
  tags:
    - V-214242
    - cat2
    - medium
    - Ubuntu

- name: "MEDIUM | unix_214243 | The Apache web server must have resource mappings set to disable the serving of certain file types"
  block:
    - name: "MEDIUM | unix_214243 | The Apache web server must have resource mappings set to disable the serving of certain file types | Remove AddHandler settings"
      lineinfile:
        path: /etc/apache2/sites-available/000-default.conf
        regexp: "(.*?)AddHandler cgi-script {{ item }}"
        state: absent
      with_items:
        - .exe
        - .dll
        - .com
        - .bat
        - .csh

    - name: "MEDIUM | unix_214243 | The Apache web server must have resource mappings set to disable the serving of certain file types | Remove Action settings"
      lineinfile:
        path: /etc/apache2/sites-available/000-default.conf
        regexp: "(.*?)Action {{ item }}.*"
        state: absent
      with_items:
        - .exe
        - .dll
        - .com
        - .bat
        - .csh
  when:
    - unix_214243
  tags:
    - V-214243
    - cat2
    - medium
    - Ubuntu

- name: "MEDIUM | unix_214244 | The Apache web server must allow the mappings to unused and vulnerable scripts to be removed"
  block:
    - name: "MEDIUM | unix_214244 | The Apache web server must allow the mappings to unused and vulnerable scripts to be removed | Get Script, ScriptAlias, ScriptAliasMatch, and ScriptInterpreterSource settings"
      shell: cat /etc/apache2/sites-available/000-default.conf | grep -i "Script" | grep '^[[:blank:]]*[^[:blank:]#;]' | sed -e 's/^[ \t]*//'
      changed_when: false
      register: apache_214244_script_settings

    - name: "MEDIUM | unix_214244 | The Apache web server must allow the mappings to unused and vulnerable scripts to be removed | Alert on script settings"
      debug:
        msg:
          - "Alert! Below are the script settings in place. Please review with ISSO"
          - "and remove any that are not needed"
          - "{{ apache_214244_script_settings.stdout_lines }}"
  when:
    - unix_214244
  tags:
    - V-214244
    - cat2
    - medium
    - Ubuntu

- name: "MEDIUM | unix_214245 | The Apache web server must have Web Distributed Authoring (WebDAV) disabled"
  command: a2dismod "{{ item }}"
  register: apache_214245_mod_disabled
  # failed_when: false
  with_items:
    - dav_fs
    - dav_lock
    - dav
  when:
    - unix_214245
  tags:
    - V-214245
    - cat2
    - medium
    - Ubuntu

- name: "MEDIUM | unix_214246 | The Apache web server must be configured to use a specified IP address and port"
  replace:
    path: /etc/apache2/ports.conf
    regexp: "^Listen(.*?).*"
    replace: "Listen {{ apache_stig_listen_ip_port }}"
  notify: restart apache2
  when:
    - unix_214246
  tags:
    - V-214246
    - cat2
    - medium
    - Ubuntu

- name: "MEDIUM | unix_214247 | Apache web server accounts accessing the directory tree, the shell, or other operating system functions and utilities must only be administrative accounts"
  debug:
    msg:
      - "Warning! This is an OS level control and should be handled in an OS Role"
  when:
    - unix_214247
  tags:
    - V-214247
    - cat2
    - medium
    - Ubuntu

- name: "MEDIUM | unix_214249 | The Apache web server must separate the hosted applications from hosted Apache web server management functionality"
  command: /bin/true
  changed_when: false
  when:
    - unix_214249
  tags:
    - V-214249
    - cat2
    - medium
    - Ubuntu
    - notimplemented

- name: "MEDIUM | unix_214250 | The Apache web server must invalidate session identifiers upon hosted application user logout or other session termination"
  command: /bin/true
  changed_when: false
  when:
    - unix_214250
  tags:
    - V-214250
    - cat2
    - medium
    - Ubuntu
    - notimplemented

- name: "MEDIUM | unix_214251 | Cookies exchanged between the Apache web server and client, such as session cookies, must have security settings that disallow cookie access outside the originating Apache web server and hosted application"
  block:
    - name: "MEDIUM | unix_214251 | Cookies exchanged between the Apache web server and client, such as session cookies, must have security settings that disallow cookie access outside the originating Apache web server and hosted application | Enable Headers module"
      command: a2enmod headers
      register: apache_214251_header_module
      changed_when: "'Enabling' in apache_214251_header_module.stdout"
      notify: restart apache2

    - name: "MEDIUM | unix_214251 | Cookies exchanged between the Apache web server and client, such as session cookies, must have security settings that disallow cookie access outside the originating Apache web server and hosted application | Register no HttpOnly and secure"
      shell: cat /etc/apache2/apache2.conf | grep -i "set-cookie" | grep -ivE 'httponly|secure' | sed 's/^[ \t]*//;s/[ \t]*$//'
      changed_when: false
      register: apache_214251_no_httponly_secure

    - name: "MEDIUM | unix_214251 | Cookies exchanged between the Apache web server and client, such as session cookies, must have security settings that disallow cookie access outside the originating Apache web server and hosted application | Register only HttpOnly"
      shell: cat /etc/apache2/apache2.conf | grep -i "set-cookie" | grep -i 'httponly' | grep -v 'secure' | sed 's/^[ \t]*//;s/[ \t]*$//'
      changed_when: false
      register: apache_214251_no_secure_only
      when: apache_214251_no_httponly_secure.stdout == ""

    - name: "MEDIUM | unix_214251 | Cookies exchanged between the Apache web server and client, such as session cookies, must have security settings that disallow cookie access outside the originating Apache web server and hosted application | Register only secure"
      shell: cat /etc/apache2/apache2.conf | grep -i "set-cookie" | grep -i 'secure' | grep -iv 'httponly' | sed 's/^[ \t]*//;s/[ \t]*$//'
      changed_when: false
      register: apache_214251_no_httponly_only
      when: apache_214251_no_httponly_secure.stdout == ""

    - name: "MEDIUM | unix_214251 | Cookies exchanged between the Apache web server and client, such as session cookies, must have security settings that disallow cookie access outside the originating Apache web server and hosted application | Add both HttpOnly and secure"
      lineinfile:
        path: /etc/apache2/apache2.conf
        regexp: "(.*?)Header edit Set-Cookie.*"
        line: "        {{ apache_214251_no_httponly_secure.stdout }};HttpOnly;secure"
      when: apache_214251_no_httponly_secure.stdout != ""
      notify: restart apache2

    - name: "MEDIUM | unix_214251 | Cookies exchanged between the Apache web server and client, such as session cookies, must have security settings that disallow cookie access outside the originating Apache web server and hosted application | Add both HttpOnly and secure"
      lineinfile:
        path: /etc/apache2/apache2.conf
        regexp: "(.*?)Header edit Set-Cookie.*"
        line: "        {{ apache_214251_no_secure_only.stdout }};secure"
      when:
        - apache_214251_no_httponly_secure.stdout == ""
        - apache_214251_no_secure_only.stdout != ""
      notify: restart apache2

    - name: "MEDIUM | unix_214251 | Cookies exchanged between the Apache web server and client, such as session cookies, must have security settings that disallow cookie access outside the originating Apache web server and hosted application | Add both HttpOnly and secure"
      lineinfile:
        path: /etc/apache2/apache2.conf
        regexp: "(.*?)Header edit Set-Cookie.*"
        line: "        {{ apache_214251_no_httponly_only.stdout }};HttpOnly"
      when:
        - apache_214251_no_httponly_secure.stdout == ""
        - apache_214251_no_httponly_only.stdout != ""
      notify: restart apache2

    - name: "MEDIUM | unix_214251 | Cookies exchanged between the Apache web server and client, such as session cookies, must have security settings that disallow cookie access outside the originating Apache web server and hosted application | Add line if doesn't exist"
      lineinfile:
        path: /etc/apache2/apache2.conf
        regexp: "(.*?)Header edit Set-Cookie.*"
        line: Header edit Set-Cookie {{ apache_214251_cookie_path }};HttpOnly;Secure
  when:
    - unix_214251
  tags:
    - V-214251
    - cat2
    - medium
    - Ubuntu

- name: "MEDIUM | unix_214252 | The Apache web server must generate a session ID long enough that it cannot be guessed through brute force"
  block:
    - name: "MEDIUM | unix_214252 | The Apache web server must generate a session ID long enough that it cannot be guessed through brute force | Find no aes256 cipher"
      shell: cat /etc/apache2/mods-enabled/ssl.conf | grep -i "SSLCipherSuite" | grep -iv "aes256" | grep -v "#" | sed 's/^[ \t]*//;s/[ \t]*$//'
      changed_when: false
      failed_when: false
      register: apache_214252_no_aes256

    - name: "MEDIUM | unix_214252 | The Apache web server must generate a session ID long enough that it cannot be guessed through brute force | Set aes256"
      lineinfile:
        path: /etc/apache2/mods-enabled/ssl.conf
        regexp: (.*?){{ apache_214252_no_aes256.stdout }}
        line: "        {{ apache_214252_no_aes256.stdout }}:aes256"
        insertbefore: "</IfModule>"
      when: apache_214252_no_aes256.stdout != ""
  when:
    - unix_214252
  tags:
    - V-214252
    - cat2
    - medium
    - Ubuntu

